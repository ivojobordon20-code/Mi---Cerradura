<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Cerradura Smart</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --primary-dark: #1d4ed8;
            --success: #16a34a; 
            --danger: #dc2626; 
            --info: #0284c7;
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text: #1e293b;
            --subtext: #64748b;
            --border: #cbd5e1;
        }

        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 90vh;
        }

        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); 
            max-width: 420px; 
            width: 100%; 
            box-sizing: border-box;
        }

        h2 { margin: 0 0 16px 0; color: var(--text); text-align: center; font-size: 24px; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid var(--border); 
            background: #f1f5f9; 
            color: var(--subtext); 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .tab-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
        }

        .panel { display: none; }
        .panel.active { display: block; }

        .status-badge { text-align: center; padding: 10px; border-radius: 6px; font-weight: bold; margin-bottom: 16px; font-size: 14px; }
        .locked { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; }
        .unlocked { background: #dcfce7; color: var(--success); border: 1px solid #86efac; }

        .form-group { margin-bottom: 14px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--subtext); font-weight: 500; }
        input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,0.2); }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 15px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-open { background: var(--primary); color: white; }
        .btn-close { background: var(--danger); color: white; }
        .btn-info { background: var(--info); color: white; }
        .btn-admin { background: #475569; color: white; }

        .counter-box { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e2e8f0; text-align: center; }
        .counter-val { font-size: 32px; font-weight: bold; color: var(--primary); margin-top: 4px; }

        .people-list { text-align: left; background: #f0f9ff; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 14px; border: 1px solid #bae6fd; }
        .people-list strong { color: #0369a1; }
        .people-list ul { margin: 6px 0 0 0; padding-left: 20px; color: #0f172a; }

        .admin-section { background: #f8fafc; padding: 12px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
        .admin-section h4 { margin: 0 0 10px 0; color: var(--text); font-size: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Control de Acceso</h2>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('user')">Acceso PIN</button>
            <button class="tab-btn" onclick="showTab('admin')">Administrador</button>
        </div>

        <!-- PANEL USUARIO -->
        <div id="userPanel" class="panel active">
            <div id="status" class="status-badge locked">CERRADURA BLOQUEADA</div>

            <form id="accessForm" onsubmit="solicitarAcceso(event)">
                <div class="form-group">
                    <label for="userPin">Ingresa tu PIN Personal (4 dígitos):</label>
                    <input type="password" id="userPin" maxlength="4" required placeholder="****">
                </div>
                <button type="submit" id="btnSubmit" class="btn-open">Ingresar (Abrir)</button>
            </form>

            <button onclick="cerrarPuerta()" id="btnClose" class="btn-close">Cerrar Puerta (Salir)</button>
            <button onclick="togglePersonasDentro()" id="btnToggleList" class="btn-info">Ver quiénes están dentro</button>

            <div id="listaPersonasContainer" class="people-list" style="display: none;">
                <strong>Personas en casa:</strong>
                <ul id="listaPersonas"></ul>
            </div>

            <div class="counter-box">
                <div>Personas actualmente en el recinto:</div>
                <div class="counter-val"><span id="counterVal">0</span> / <span id="maxVal">10</span></div>
            </div>
        </div>

        <!-- PANEL ADMINISTRADOR -->
        <div id="adminPanel" class="panel">
            <div class="admin-section">
                <h4>Configurar Límite de Aforo</h4>
                <form onsubmit="guardarAforo(event)">
                    <div class="form-group">
                        <label for="adminKey1">Clave de Admin:</label>
                        <input type="password" id="adminKey1" required placeholder="Clave maestra">
                    </div>
                    <div class="form-group">
                        <label for="maxPersons">Aforo Máximo:</label>
                        <input type="number" id="maxPersons" min="1" required placeholder="Ej: 10">
                    </div>
                    <button type="submit" class="btn-admin">Guardar Límite</button>
                </form>
            </div>

            <div class="admin-section">
                <h4>Registrar Nuevo Usuario</h4>
                <form onsubmit="crearUsuario(event)">
                    <div class="form-group">
                        <label for="adminKey2">Clave de Admin:</label>
                        <input type="password" id="adminKey2" required placeholder="Clave maestra">
                    </div>
                    <div class="form-group">
                        <label for="newUserName">Nombre del Usuario:</label>
                        <input type="text" id="newUserName" required placeholder="Ej: Roberto">
                    </div>
                    <div class="form-group">
                        <label for="newUserPin">Asignar PIN (4 dígitos):</label>
                        <input type="password" id="newUserPin" maxlength="4" required placeholder="****">
                    </div>
                    <button type="submit" class="btn-admin">Crear PIN de Usuario</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8XoxchvSqVH7GkFmfvEyecJp0VodSbfS8X-nxv6A8WAO1WG926N-PszoViysT3UTxSQ/exec";

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            if(tab === 'user') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('userPanel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('adminPanel').classList.add('active');
            }
        }

        async function solicitarAcceso(e) {
            e.preventDefault();
            const pinInput = document.getElementById('userPin');
            const pin = pinInput.value.trim();
            const btn = document.getElementById('btnSubmit');

            if(!pin) return alert("Ingresa un PIN válido.");

            btn.disabled = true;
            btn.innerText = "Abriendo...";

            try {
                const res = await fetch(`${SCRIPT_URL}?action=abrir_pin&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();
                
                if (data.status === "OK") {
                    document.getElementById('status').innerText = `BIENVENIDO/A: ${data.usuario.toUpperCase()}`;
                    document.getElementById('status').className = 'status-badge unlocked';
                    document.getElementById('counterVal').innerText = data.personasDentro;
                    
                    // Si el recuadro está abierto, actualiza su contenido
                    if(document.getElementById('listaPersonasContainer').style.display === 'block') {
                        actualizarListaPersonas();
                    }
                } else {
                    alert(`Acceso denegado: ${data.msg}`);
                }
            } catch (err) {
                alert("Error de conexión con el servidor.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Ingresar (Abrir)";
            }
        }

        async function cerrarPuerta() {
            const pinInput = document.getElementById('userPin');
            const pin = pinInput.value.trim();
            const btn = document.getElementById('btnClose');

            if(!pin) return alert("Por favor, ingresa tu PIN para registrar tu salida.");

            btn.disabled = true;

            try {
                const res = await fetch(`${SCRIPT_URL}?action=cerrar_pin&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();

                if (data.status === "OK") {
                    document.getElementById('status').innerText = 'CERRADURA BLOQUEADA';
                    document.getElementById('status').className = 'status-badge locked';
                    document.getElementById('counterVal').innerText = data.personasDentro;
                    pinInput.value = '';
                    
                    // Si el recuadro está abierto, actualiza su contenido
                    if(document.getElementById('listaPersonasContainer').style.display === 'block') {
                        actualizarListaPersonas();
                    }
                } else {
                    alert(`Error al salir: ${data.msg}`);
                }
            } catch (err) {
                alert("Error al enviar comando de salida.");
            } finally {
                btn.disabled = false;
            }
        }

        // ALTERNAR MOSTRAR / OCULTAR LISTA
        async function togglePersonasDentro() {
            const container = document.getElementById('listaPersonasContainer');
            const btn = document.getElementById('btnToggleList');

            if (container.style.display === 'none' || container.style.display === '') {
                btn.innerText = "Cargando...";
                await actualizarListaPersonas();
                container.style.display = 'block';
                btn.innerText = "Ocultar quiénes están dentro";
            } else {
                container.style.display = 'none';
                btn.innerText = "Ver quiénes están dentro";
            }
        }

        // OBTENER Y RELLENAR LA LISTA
        async function actualizarListaPersonas() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=get_personas_dentro`);
                const data = await res.json();
                
                if(data.status === "OK") {
                    const ul = document.getElementById('listaPersonas');
                    ul.innerHTML = '';
                    if(data.lista.length === 0) {
                        ul.innerHTML = '<li>No hay nadie dentro de la casa.</li>';
                    } else {
                        data.lista.forEach(persona => {
                            const li = document.createElement('li');
                            li.textContent = persona;
                            ul.appendChild(li);
                        });
                    }
                    if(data.personasDentro !== undefined) {
                        document.getElementById('counterVal').innerText = data.personasDentro;
                    }
                }
            } catch(e) {
                console.error("Error al obtener lista de presentes.");
            }
        }

        async function guardarAforo(e) {
            e.preventDefault();
            const adminPin = document.getElementById('adminKey1').value;
            const maxP = document.getElementById('maxPersons').value;
            
            try {
                const res = await fetch(`${SCRIPT_URL}?action=set_config&adminPin=${encodeURIComponent(adminPin)}&maxPersonas=${maxP}`);
                const data = await res.json();
                if(data.status === "OK") {
                    alert("Límite de aforo guardado correctamente.");
                    document.getElementById('maxVal').innerText = data.maxPersonas;
                } else {
                    alert(data.msg);
                }
            } catch(error) {
                alert("Error al guardar la configuración.");
            }
        }

        async function crearUsuario(e) {
            e.preventDefault();
            const adminPin = document.getElementById('adminKey2').value;
            const nombre = document.getElementById('newUserName').value;
            const pin = document.getElementById('newUserPin').value;
            
            try {
                const res = await fetch(`${SCRIPT_URL}?action=create_user&adminPin=${encodeURIComponent(adminPin)}&nombre=${encodeURIComponent(nombre)}&pin=${encodeURIComponent(pin)}`);
                const data = await res.json();
                if(data.status === "OK") {
                    alert(`Usuario ${nombre} registrado exitosamente con PIN ${pin}`);
                    document.getElementById('newUserName').value = '';
                    document.getElementById('newUserPin').value = '';
                } else {
                    alert(data.msg);
                }
            } catch(error) {
                alert("Error al crear el usuario.");
            }
        }

        async function cargarEstadoInicial() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=read`);
                const data = await res.json();
                if (data.personasDentro !== undefined) {
                    document.getElementById('counterVal').innerText = data.personasDentro;
                }
                if (data.maxPersonas !== undefined) {
                    document.getElementById('maxVal').innerText = data.maxPersonas;
                }
            } catch (e) {}
        }

        cargarEstadoInicial();
    </script>
</body>
</html>
