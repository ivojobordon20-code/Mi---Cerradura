<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerradura Inteligente - Admin & PINs</title>
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 420px; width: 100%; }
        h2 { margin-top: 0; color: #1e293b; text-align: center; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid #cbd5e1; background: #f1f5f9; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .panel { display: none; }
        .panel.active { display: block; }
        .status-badge { text-align: center; padding: 8px; border-radius: 6px; font-weight: bold; margin-bottom: 16px; }
        .locked { background: #fee2e2; color: var(--danger); }
        .unlocked { background: #dcfce7; color: var(--success); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: #64748b; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-open { background: var(--primary); color: white; }
        .btn-close { background: #dc2626; color: white; margin-top: 8px; }
        .btn-admin { background: #475569; color: white; }
        .counter-box { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e2e8f0; text-align: center; }
        .counter-val { font-size: 24px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Control de Acceso</h2>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('user')">Acceso PIN</button>
            <button class="tab-btn" onclick="showTab('admin')">Administrador</button>
        </div>

        <!-- PANEL DE USUARIO -->
        <div id="userPanel" class="panel active">
    <div id="status" class="status-badge locked">CERRADURA BLOQUEADA</div>

    <form>
        <div class="form-group">
            <label for="userPin">Ingresa tu PIN Personal (4 dígitos):</label>
            <input type="password" id="userPin" maxlength="4" required placeholder="****">
        </div>
        <button type="button" onclick="ingresarConPin()" class="btn-open">Ingresar (Abrir)</button>
        <button type="button" onclick="salirConPin()" class="btn-close">Cerrar Puerta (Salir)</button>
        <button type="button" onclick="verPersonasDentro()" class="btn-admin" style="margin-top: 10px; background-color: #0284c7;">Ver quiénes están dentro</button>
    </form>

    <div id="listaPersonasContainer" style="margin-top: 15px; display: none; background: #e0f2fe; padding: 12px; border-radius: 6px;">
        <h4 style="margin: 0 0 8px 0; color: #0369a1;">Personas en casa:</h4>
        <ul id="listaPersonas" style="margin: 0; padding-left: 20px;"></ul>
        </div>
    </div>

        <!-- PANEL DE ADMINISTRADOR -->
        <div id="adminPanel" class="panel">
            <form onsubmit="guardarAforo(event)">
                <h3 style="margin-top:0; font-size:16px;">1. Límite de Aforo</h3>
                <div class="form-group">
                    <label>Clave Maestra Admin:</label>
                    <input type="password" id="adminKey1" required placeholder="Clave Maestro (9999)">
                </div>
                <div class="form-group">
                    <label>Máximo de Personas Permitidas:</label>
                    <input type="number" id="maxPersons" min="1" required placeholder="Ej. 5">
                </div>
                <button type="submit" class="btn-admin">Guardar Límite</button>
            </form>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #cbd5e1;">

            <form onsubmit="crearUsuario(event)">
                <h3 style="margin-top:0; font-size:16px;">2. Asignar Nuevo PIN a Usuario</h3>
                <div class="form-group">
                    <label>Clave Maestra Admin:</label>
                    <input type="password" id="adminKey2" required placeholder="Clave Maestro (9999)">
                </div>
                <div class="form-group">
                    <label>Nombre del Usuario:</label>
                    <input type="text" id="newUserName" required placeholder="Ej. Juan Pérez">
                </div>
                <div class="form-group">
                    <label>PIN Asignado (4 dígitos):</label>
                    <input type="text" id="newUserPin" maxlength="4" required placeholder="Ej. 4321">
                </div>
                <button type="submit" class="btn-open">Crear PIN de Usuario</button>
            </form>
        </div>

        <div class="counter-box">
            <div>Personas en el recinto: <span id="countVal" class="counter-val">0</span> / <span id="maxVal">--</span></div>
        </div>
    </div>

    <script>
    // URL de tu implementación web de Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8XoxchvSqVH7GkFmfvEyecJp0VodSbfS8X-nxv6A8WAO1WG926N-PszoViysT3UTxSQ/exec";

    // Cambiar entre la pestaña de Usuarios y la de Administrador
    function showTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        if(tab === 'user') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('userPanel').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('adminPanel').classList.add('active');
        }
    }

    // 1. Abrir puerta con PIN (Entrada)
    async function abrirConPin() {
        const pin = document.getElementById('userPin').value;
        if(!pin) return alert("Por favor ingresa tu PIN para ABRIR.");
        
        try {
            const res = await fetch(`${SCRIPT_URL}?action=abrir_pin&pin=${encodeURIComponent(pin)}`);
            const data = await res.json();
            
            if(data.status === "OK") {
                alert(`¡Bienvenido/a ${data.usuario}! Acceso concedido.`);
                document.getElementById('status').innerText = 'ABIERTO - ENTRADA CONCEDIDA';
                document.getElementById('status').className = 'status-badge unlocked';
                document.getElementById('countVal').innerText = data.personasDentro;
            } else {
                alert(`Acceso Denegado: ${data.msg}`);
            }
        } catch(error) {
            alert("Error de conexión con el servidor.");
        }
    }

    // 2. Cerrar puerta con PIN (Salida)
    async function cerrarConPin() {
        const pin = document.getElementById('userPin').value;
        if(!pin) return alert("Por favor ingresa tu PIN para CERRAR.");
        
        try {
            const res = await fetch(`${SCRIPT_URL}?action=cerrar_pin&pin=${encodeURIComponent(pin)}`);
            const data = await res.json();
            
            if(data.status === "OK") {
                alert(`¡Hasta luego ${data.usuario}! Puerta cerrada.`);
                document.getElementById('status').innerText = 'PUERTA CERRADA';
                document.getElementById('status').className = 'status-badge locked';
                document.getElementById('countVal').innerText = data.personasDentro;
            } else {
                alert(`Error al cerrar: ${data.msg}`);
            }
        } catch(error) {
            alert("Error de conexión con el servidor.");
        }
    }

    // 3. Ver lista de personas en casa
    async function verPersonasDentro() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=get_personas_dentro`);
            const data = await res.json();
            
            if(data.status === "OK") {
                const ul = document.getElementById('listaPersonas');
                ul.innerHTML = '';
                if(data.lista.length === 0) {
                    ul.innerHTML = '<li>No hay nadie dentro de la casa.</li>';
                } else {
                    data.lista.forEach(persona => {
                        const li = document.createElement('li');
                        li.textContent = persona;
                        ul.appendChild(li);
                    });
                }
                document.getElementById('listaPersonasContainer').style.display = 'block';
            }
        } catch(error) {
            alert("No se pudo obtener la lista de personas.");
        }
    }

    // 4. Configurar límite de aforo (Admin)
    async function guardarAforo(e) {
        e.preventDefault();
        const adminPin = document.getElementById('adminKey1').value;
        const maxP = document.getElementById('maxPersons').value;
        
        try {
            const res = await fetch(`${SCRIPT_URL}?action=set_config&adminPin=${encodeURIComponent(adminPin)}&maxPersonas=${maxP}`);
            const data = await res.json();
            if(data.status === "OK") {
                alert("Límite de aforo guardado correctamente.");
                document.getElementById('maxVal').innerText = data.maxPersonas;
            } else {
                alert(data.msg);
            }
        } catch(error) {
            alert("Error al guardar la configuración.");
        }
    }

    // 5. Asignar PIN a un nuevo usuario (Admin)
    async function crearUsuario(e) {
        e.preventDefault();
        const adminPin = document.getElementById('adminKey2').value;
        const nombre = document.getElementById('newUserName').value;
        const pin = document.getElementById('newUserPin').value;
        
        try {
            const res = await fetch(`${SCRIPT_URL}?action=create_user&adminPin=${encodeURIComponent(adminPin)}&nombre=${encodeURIComponent(nombre)}&pin=${encodeURIComponent(pin)}`);
            const data = await res.json();
            if(data.status === "OK") {
                alert(`Usuario ${nombre} registrado exitosamente con PIN ${pin}`);
                document.getElementById('newUserName').value = '';
                document.getElementById('newUserPin').value = '';
            } else {
                alert(data.msg);
            }
        } catch(error) {
            alert("Error al crear el usuario.");
        }
    }

    // 6. Consultar estado del aforo al cargar la página
    async function cargarEstado() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=read`);
            const data = await res.json();
            document.getElementById('countVal').innerText = data.personasDentro;
            document.getElementById('maxVal').innerText = data.maxPersonas;
        } catch(e){}
    }

    // Ejecutar consulta inicial
    cargarEstado();
</script>
</body>
</html>
