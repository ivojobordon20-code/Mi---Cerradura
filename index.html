<!-- En el Panel de Administrador de index.html -->
<form onsubmit="verPersonasDentro(event)" style="margin-top: 15px;">
    <h3 style="margin-top:0; font-size:16px;">3. Ver Personas Actualmente Dentro</h3>
    <div class="form-group">
        <label>Clave Maestra Admin:</label>
        <input type="password" id="adminKey3" required placeholder="Clave Maestro (9999)">
    </div>
    <button type="submit" class="btn-admin">Consultar Presentes</button>
</form>

<div id="listaPersonasContainer" style="margin-top: 10px; display: none;">
    <h4>Usuarios en casa:</h4>
    <ul id="listaPersonas"></ul>
</div>

<script>
async function salirConPin(e) {
    e.preventDefault();
    const pin = document.getElementById('userPin').value;
    const res = await fetch(`${SCRIPT_URL}?action=cerrar_pin&pin=${encodeURIComponent(pin)}`);
    const data = await res.json();
    
    if(data.status === "OK") {
        alert(`¡Hasta luego ${data.usuario}! Salida registrada.`);
        document.getElementById('status').innerText = 'PUERTA CERRADA';
        document.getElementById('status').className = 'status-badge locked';
        document.getElementById('countVal').innerText = data.personasDentro;
    } else {
        alert(`Error al registrar salida: ${data.msg}`);
    }
}

async function verPersonasDentro(e) {
    e.preventDefault();
    const adminPin = document.getElementById('adminKey3').value;
    const res = await fetch(`${SCRIPT_URL}?action=get_personas_dentro&adminPin=${adminPin}`);
    const data = await res.json();
    
    if(data.status === "OK") {
        const ul = document.getElementById('listaPersonas');
        ul.innerHTML = '';
        if(data.lista.length === 0) {
            ul.innerHTML = '<li>No hay nadie dentro de la casa.</li>';
        } else {
            data.lista.forEach(persona => {
                const li = document.createElement('li');
                li.textContent = persona;
                ul.appendChild(li);
            });
        }
        document.getElementById('listaPersonasContainer').style.display = 'block';
    } else {
        alert(data.msg);
    }
}
</script>
