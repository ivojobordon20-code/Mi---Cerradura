<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerradura Inteligente</title>
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
        h2 { margin-top: 0; color: #1e293b; text-align: center; }
        .status-badge { text-align: center; padding: 8px; border-radius: 6px; font-weight: bold; margin-bottom: 16px; }
        .locked { background: #fee2e2; color: var(--danger); }
        .unlocked { background: #dcfce7; color: var(--success); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: #64748b; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-open { background: var(--primary); color: white; }
        .btn-close { background: #64748b; color: white; margin-top: 8px; }
        .counter { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e2e8f0; text-align: center; }
        .counter-val { font-size: 24px; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>
    <div class="card">
        <h2>Control de Acceso</h2>
        <div id="status" class="status-badge locked">CERRADURA BLOQUEADA</div>

        <form id="accessForm" onsubmit="solicitarAcceso(event)">
            <div class="form-group">
                <label for="username">Nombre de Usuario:</label>
                <input type="text" id="username" required placeholder="Ingresa tu usuario">
            </div>
            <button type="submit" id="btnSubmit" class="btn-open">Abrir Cerradura</button>
        </form>

        <button onclick="cerrarPuerta()" class="btn-close">Cerrar Puerta</button>

        <div class="counter">
            <div>Entradas Registradas</div>
            <div id="counterVal" class="counter-val">0</div>
        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL COPIADA DE GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8XoxchvSqVH7GkFmfvEyecJp0VodSbfS8X-nxv6A8WAO1WG926N-PszoViysT3UTxSQ/exec";

        async function solicitarAcceso(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "Enviando...";

            try {
                const url = `${SCRIPT_URL}?action=abrir&usuario=${encodeURIComponent(user)}`;
                const res = await fetch(url);
                const data = await res.json();
                
                document.getElementById('counterVal').innerText = data.contador;
                document.getElementById('status').innerText = 'COMANDO ENVIADO: ABRIR';
                document.getElementById('status').className = 'status-badge unlocked';
            } catch (err) {
                alert("Error al conectar.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Abrir Cerradura";
            }
        }

        async function cerrarPuerta() {
            try {
                const url = `${SCRIPT_URL}?action=cerrar`;
                await fetch(url);
                document.getElementById('status').innerText = 'COMANDO ENVIADO: CERRAR';
                document.getElementById('status').className = 'status-badge locked';
            } catch (err) {
                alert("Error al enviar comando.");
            }
        }

        async function cargarEstadoInicial() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=read`);
                const data = await res.json();
                document.getElementById('counterVal').innerText = data.contador;
            } catch (e) {}
        }
        cargarEstadoInicial();
    </script>
</body>
</html>
